<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--head-->
    <script>
      // Mark that JavaScript runs (the 404's flat die stays hidden unless 3D can't run).
      document.documentElement.classList.add('js');
      // Apply a saved theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Cloudflare Web Analytics: cookie-free page counts. Only on the live domain, so local previews and QA runs aren't counted.
      if (location.hostname === 'samanthaparas.com') {
        var b = document.createElement('script');
        b.defer = true;
        b.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        b.setAttribute('data-cf-beacon', '{"token": "7f6dd1e583fd4a6293dd135179996b87"}');
        document.body.appendChild(b);
      }
    </script>
  </body>
</html>
