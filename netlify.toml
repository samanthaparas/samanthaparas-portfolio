[build]
  command = "npm run build"
  publish = "dist"

# The site's public address, for canonical links, og:url and the sitemap. Change it when a custom domain is added.
[build.environment]
  VITE_SITE_URL = "https://samanthaparas.com"

# Every page is prerendered to its own index.html. Unknown paths get the prerendered 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
