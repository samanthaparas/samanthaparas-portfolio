# Once a day, saves the GitHub contribution calendar to the contributions-data branch.
# The About page reads it from there, so updating it never triggers a Netlify build.
name: Update GitHub contributions

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: contributions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the contribution calendar
        run: node scripts/fetch-contributions.mjs out/contributions.json
        env:
          GH_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Publish to the contributions-data branch
        working-directory: out
        run: |
          # If Netlify ever sees this branch, it skips the build.
          printf '[build]\n  ignore = "exit 0"\n' > netlify.toml
          git init -q -b contributions-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update contributions"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" contributions-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
